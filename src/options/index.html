<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glosse settings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
      h1 { font-size: 20px; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; }
      input[type=text], input[type=password], select, input[type=number] { width: 100%; padding: 8px; font-size: 14px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row label { margin: 0; font-weight: 400; }
      button { margin-top: 18px; padding: 8px 16px; font-size: 14px; }
      .note { color: #666; font-size: 13px; }
      .ok { color: #1a7f37; }
      .help {
        display: inline-flex; align-items: center; justify-content: center;
        width: 16px; height: 16px; margin-left: 4px; border-radius: 50%;
        border: 1px solid #999; color: #666; font-size: 11px; font-weight: 600;
        cursor: help; vertical-align: middle; user-select: none;
      }
      .help:hover, .help:focus { border-color: #1a73e8; color: #1a73e8; outline: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
